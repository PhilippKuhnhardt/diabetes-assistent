name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Check web/app.js syntax
        run: node --check web/app.js && for file in web/ui/*.js web/i18n/*.js; do node --check "$file"; done
      - name: Install Playwright
        run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: Click test (navigation, "+", cards, settings)
        run: |
          python tests/e2e/server.py > e2e-server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/ > /dev/null && break; sleep 1; done
          node tests/e2e/smoke.js || (cat e2e-server.log; exit 1)
