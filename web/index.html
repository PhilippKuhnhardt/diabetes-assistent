<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11261e">
  <title>Diabetes-Tagebuch</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Tagebuch">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <img class="brand-mark" src="/logo.svg" width="40" height="40" alt="">
        <strong>Diabetes-Tagebuch</strong>
      </div>
      <div id="current-glucose" class="glucose-widget" data-status="unavailable" role="status" aria-live="polite" aria-label="Aktueller Blutzucker">
        <div class="glucose-main"><strong id="glucose-value">—</strong><span id="glucose-trend">Trend nicht verfügbar</span></div>
        <small id="glucose-meta" hidden></small>
      </div>
      <div class="topbar-actions"><button type="button" id="inbox-badge" class="inbox-badge" hidden></button><div id="connection" class="status" hidden></div></div>
    </header>

    <!-- App navigation (concept 2026-11-18): a tab bar at the bottom on phones and tablets, a rail on the left
         on wide screens. "+" opens the choice of what to enter (web/ui/quick-add.js). -->
    <nav class="appnav" aria-label="Navigation">
      <a href="?view=diary" class="appnav-item" data-nav="today"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg><span>Heute</span></a>
      <a href="?view=diary" class="appnav-item" data-nav="history"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v15H4z M4 10h16 M9 3v4 M15 3v4"/></svg><span>Verlauf</span></a>
      <button type="button" class="appnav-add" id="nav-add" aria-label="Eintragen" aria-haspopup="dialog"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14 M5 12h14"/></svg><span>Eintragen</span></button>
      <a href="?view=analysis" class="appnav-item" data-nav="analysis"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10 M10 20V4 M16 20v-7 M22 20H2"/></svg><span>Analyse</span></a>
      <a href="?view=settings" class="appnav-item" data-nav="settings"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16 M4 12h16 M4 18h16"/></svg><span>Mehr</span></a>
    </nav>
    <nav class="tabs" aria-label="Bereiche">
      <a class="tab active" href="?view=diary" data-view="diary">Tagebuch</a>
      <a class="tab" href="?view=analysis" data-view="analysis">Analyse</a>
      <a class="tab" href="?view=settings" data-view="settings">Einstellungen</a>
    </nav>

    <main>
      <section id="diary-view" class="view">
        <div class="page-head diary-head">
          <div><h1>Dein Tag</h1></div>
          <div class="day-nav">
            <button type="button" id="prev-day" aria-label="Vorheriger Tag">←</button>
            <input id="selected-day" type="date" aria-label="Datum">
            <button type="button" id="next-day" aria-label="Nächster Tag">→</button>
            <button type="button" id="refresh-day" class="quiet" aria-label="Aktualisieren" title="Aktualisieren"><span aria-hidden="true">↻</span><span class="refresh-label">Aktualisieren</span></button>
          </div>
        </div>
        <div class="diary-mode" role="group" aria-label="Ansicht im Tagebuch">
          <button type="button" data-diary-mode="now" aria-pressed="true">Jetzt</button>
          <button type="button" data-diary-mode="review" aria-pressed="false">Tag durchgehen</button>
        </div>
        <div id="banner" class="banner" hidden></div>
        <div id="timezone-banner" class="banner timezone-banner" hidden></div>
        <!-- "Zu erledigen" across the last days (web/ui/today.js, from /api/inbox). -->
        <div id="inbox-host"></div>
        <div class="diary-grid">
          <section class="panel entry-panel">
            <!-- Chart, "Wirkt noch" and the last three hours (web/ui/today.js). -->
            <div id="overview-host"></div>
            <!-- On phones and tablets the entry is a full-screen sheet opened from "+"; on wide screens it stays here. -->
            <div id="entry-drawer" class="entry-drawer">
            <div class="section-head entry-drawer-head">
              <button type="button" id="entry-back" class="quiet entry-drawer-nav" aria-label="Zurück zur Auswahl" title="Zurück zur Auswahl">‹</button>
              <h2 id="entry-title">Eintrag hinzufügen</h2>
              <button type="button" id="entry-close" class="quiet entry-drawer-nav" aria-label="Schließen">×</button>
            </div>
            <!-- "KE & IE" on phones: what still acts, since the sheet covers "Heute" (app.js renderEntryActive). -->
            <div id="entry-active-host" class="entry-active"></div>
            <!-- The entry form (web/ui/entry.js) renders in here. -->
            <div id="entry-form-host"></div>
            </div>
          </section>
          <!-- "Tag durchgehen" (web/ui/day.js) renders in here. -->
          <section class="records review-panel"></section>
        </div>
      </section>

      <!-- Analyse (web/ui/analysis.js) renders in here the first time it is opened. -->
      <section id="analysis-view" class="view" hidden></section>

      <!-- Profile and model settings (web/ui/settings.js); on phones a list of pages, one page at a time. -->
      <section id="settings-view" class="view" hidden></section>
    </main>
  </div>
  <!-- The choice behind "+" (web/ui/quick-add.js) renders in here. -->
  <dialog id="add-dialog" class="add-dialog" aria-label="Eintragen"></dialog>
  <!-- A saved entry as a card (web/ui/entry-card.js) renders in here. -->
  <dialog id="edit-dialog" class="card-dialog" aria-labelledby="edit-dialog-title"></dialog>
  <!-- The meal chat (web/ui/agent-chat.js) renders in here. -->
  <dialog id="agent-dialog" class="chat-dialog" aria-labelledby="agent-dialog-title"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
