<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11261e">
  <title>Anmelden · Tagebuch</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="login-page">
  <main class="login-card panel">
    <div class="login-brand"><img src="/logo.svg" width="48" height="48" alt=""><span>Diabetes-Tagebuch</span></div>
    <h1>Anmelden</h1>
    <form action="/login" method="post">
      <label>Benutzername
        <input name="username" autocomplete="username" value="privat" required>
      </label>
      <label>Passwort
        <input name="password" type="password" autocomplete="current-password" required autofocus>
      </label>
      <p id="login-error" class="form-error" hidden>Passwort stimmt nicht.</p>
      <button class="primary" type="submit">Anmelden</button>
    </form>
  </main>
  <script>document.getElementById("login-error").hidden = !location.search.includes("error=1");</script>
</body>
</html>
