<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 584" role="img" aria-labelledby="arch-title" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">
  <title id="arch-title">Target architecture: one set of rules computes on the server and the iPhone, the server stays the hub</title>
  <style>
    .ink { fill: #1f2328; }
    .quiet { fill: #59636e; }
    .edge { stroke: #8c959f; }
    .edge-fill { fill: #8c959f; }
    .box { fill: none; stroke: #8c959f; stroke-width: 1.25; }
    .main { fill: rgba(31, 136, 61, 0.12); stroke: #1f883d; stroke-width: 2; }
    .group { fill: rgba(140, 149, 159, 0.08); stroke: #8c959f; stroke-width: 1.25; }
    .bg { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e6edf3; }
      .quiet { fill: #9198a1; }
      .edge, .box, .group { stroke: #6e7681; }
      .edge-fill { fill: #6e7681; }
      .main { fill: rgba(63, 185, 80, 0.15); stroke: #3fb950; }
      .bg { fill: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" class="edge-fill"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="760" height="584"/>
  <text x="24" y="30" font-size="15" font-weight="600" class="ink">One set of rules computes on the server and the iPhone, the server stays the hub</text>

  <g fill="none" stroke-width="1.25" class="edge">
    <path d="M492 84H250" marker-end="url(#arch-arrow)"/>
    <path d="M145 112V200" marker-start="url(#arch-arrow)" marker-end="url(#arch-arrow)"/>
    <path d="M244 288V360" marker-start="url(#arch-arrow)" marker-end="url(#arch-arrow)"/>
    <path d="M616 288V400" marker-start="url(#arch-arrow)" marker-end="url(#arch-arrow)"/>
    <path d="M496 516H464" stroke-dasharray="4 4" marker-end="url(#arch-arrow)"/>
  </g>

  <rect x="40" y="56" width="210" height="56" rx="8" class="box"/>
  <text x="145" y="80" text-anchor="middle" font-weight="600" class="ink">Nightscout</text>
  <text x="145" y="98" text-anchor="middle" font-size="11.5" class="quiet">CGM, treatments, profile</text>

  <rect x="492" y="56" width="228" height="56" rx="8" class="box"/>
  <text x="606" y="80" text-anchor="middle" font-weight="600" class="ink">Libre 3 Plus</text>
  <text x="606" y="98" text-anchor="middle" font-size="11.5" class="quiet">LibreLinkUp uploader</text>
  <text x="371" y="76" text-anchor="middle" font-size="11.5" class="quiet">internet only</text>
  <text x="153" y="146" font-size="11.5" class="quiet">mirror, write</text>

  <rect x="24" y="160" width="712" height="128" rx="8" class="group"/>
  <text x="40" y="184" font-size="14" font-weight="600" class="ink">Server</text>
  <rect x="40" y="200" width="210" height="72" rx="8" class="box"/>
  <text x="56" y="224" font-weight="600" class="ink">Nightscout mirror</text>
  <text x="56" y="240" font-size="11.5" class="quiet">the only writer</text>
  <text x="56" y="256" font-size="11.5" class="quiet">duplicate check by id</text>
  <rect x="266" y="200" width="210" height="72" rx="8" class="box"/>
  <text x="282" y="224" font-weight="600" class="ink">SQLite + sync API</text>
  <text x="282" y="240" font-size="11.5" class="quiet">inputs with seq</text>
  <text x="282" y="256" font-size="11.5" class="quiet">days as a cache</text>
  <rect x="492" y="200" width="228" height="72" rx="8" class="main"/>
  <text x="508" y="224" font-weight="600" class="ink">app/ (Python, reference)</text>
  <text x="508" y="240" font-size="11.5" class="ink">factor, Automatik, dose</text>
  <text x="508" y="256" font-size="11.5" class="ink">"Wirkt noch", warnings</text>

  <text x="252" y="318" font-size="11.5" class="quiet">pull: changes since seq</text>
  <text x="252" y="334" font-size="11.5" class="quiet">push: queue with op_id</text>
  <text x="624" y="346" font-size="11.5" class="quiet">/api, online only</text>

  <rect x="24" y="360" width="440" height="200" rx="8" class="box"/>
  <text x="40" y="384" font-size="14" font-weight="600" class="ink">iPhone app (Widget, Watch through it)</text>
  <rect x="40" y="400" width="200" height="72" rx="8" class="box"/>
  <text x="56" y="424" font-weight="600" class="ink">SwiftUI</text>
  <text x="56" y="440" font-size="11.5" class="quiet">Jetzt, Verlauf</text>
  <text x="56" y="456" font-size="11.5" class="quiet">BG age always visible</text>
  <rect x="256" y="400" width="192" height="72" rx="8" class="main"/>
  <text x="272" y="424" font-weight="600" class="ink">core/ (Rust)</text>
  <text x="272" y="440" font-size="11.5" class="ink">same rules, parity-checked</text>
  <text x="272" y="456" font-size="11.5" class="ink">computes offline</text>
  <rect x="40" y="488" width="408" height="56" rx="8" class="box"/>
  <text x="56" y="512" font-weight="600" class="ink">Local SQLite + queue</text>
  <text x="56" y="528" font-size="11.5" class="quiet">entries count at once, reach the server later</text>

  <rect x="496" y="400" width="240" height="72" rx="8" class="box"/>
  <text x="512" y="424" font-weight="600" class="ink">Web app</text>
  <text x="512" y="440" font-size="11.5" class="quiet">browser, as today</text>
  <text x="512" y="456" font-size="11.5" class="quiet">draws, does not compute</text>
  <rect x="496" y="488" width="240" height="56" rx="8" class="box" stroke-dasharray="4 4"/>
  <text x="512" y="512" font-weight="600" class="ink">Read the sensor (offline)</text>
  <text x="512" y="528" font-size="11.5" class="quiet">entered as finger BG</text>
</svg>
