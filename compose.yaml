services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    ports:
      - "127.0.0.1:${APP_PORT:-8765}:8765"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8765
      APP_DB: /data/app.sqlite3
    volumes:
      - ./data:/data
