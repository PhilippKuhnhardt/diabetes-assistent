services:
  app:
    build: .
    restart: unless-stopped
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8765}:8765"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8765
      APP_DB: /data/app.sqlite3
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Berlin}
      NIGHTSCOUT_URL: ${NIGHTSCOUT_URL:?NIGHTSCOUT_URL setzen}
      NIGHTSCOUT_AUTH_MODE: ${NIGHTSCOUT_AUTH_MODE:-secret}
      NIGHTSCOUT_CREDENTIAL: ${NIGHTSCOUT_CREDENTIAL:?NIGHTSCOUT_CREDENTIAL setzen}
      APP_PASSWORD: ${APP_PASSWORD:?APP_PASSWORD setzen}
      API_READ_KEY: ${API_READ_KEY:-}
      MCP_API_KEY: ${MCP_API_KEY:-}
      APP_SYNC_MINUTES: ${APP_SYNC_MINUTES:-5}
    volumes:
      - ${APP_DATA_DIR:-./data}:/data
