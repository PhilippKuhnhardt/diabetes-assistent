services:
  app:
    build: .
    restart: unless-stopped
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8765}:8765"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8765
      APP_DB: /data/app.sqlite3
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Berlin}
      APP_LANGUAGE: ${APP_LANGUAGE:-de}
      APP_INSULIN: ${APP_INSULIN:-fiasp}
      NIGHTSCOUT_URL: ${NIGHTSCOUT_URL:?set NIGHTSCOUT_URL}
      NIGHTSCOUT_AUTH_MODE: ${NIGHTSCOUT_AUTH_MODE:-secret}
      NIGHTSCOUT_CREDENTIAL: ${NIGHTSCOUT_CREDENTIAL:?set NIGHTSCOUT_CREDENTIAL}
      APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD}
      API_READ_KEY: ${API_READ_KEY:-}
      MCP_API_KEY: ${MCP_API_KEY:-}
      MCP_OAUTH_REDIRECTS: ${MCP_OAUTH_REDIRECTS:-}
      APP_SYNC_MINUTES: ${APP_SYNC_MINUTES:-2}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      PUSHOVER_APP_TOKEN: ${PUSHOVER_APP_TOKEN:-}
      PUSHOVER_USER_KEY: ${PUSHOVER_USER_KEY:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      APP_HEARTBEAT_URL: ${APP_HEARTBEAT_URL:-}
    volumes:
      - ${APP_DATA_DIR:-./data}:/data
